# Portfolio: main に push されるたびに、作ったものを記事にして GitHub Pages に公開する。
#   1. scripts/build_portfolio.py … コード・NOTE.md・コミット履歴・terraform graph から記事ページを生成
#   2. GitHub Pages にデプロイ
name: Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 自動コミットで連続 push されたときは、古い実行を止めて最新だけ公開する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 活動履歴のために全コミットを取得
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false # terraform graph の出力をそのまま受け取るため
      - name: ページを生成
        run: |
          pip install markdown==3.10.3
          python3 scripts/build_portfolio.py

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Secrets 未登録のうちはメール送信を飛ばす（if では secrets を直接参照できないため env 経由）
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # 公開できたら Gmail に通知する（失敗時の通知は GitHub 標準のメールに任せる）
      - name: 公開完了を Gmail で通知
        if: env.GMAIL_USER != ''
        uses: dawidd6/action-send-mail@v23
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }} # Google のアプリパスワード（通常のパスワードではない）
          from: Portfolio <${{ secrets.GMAIL_USER }}>
          to: ${{ secrets.GMAIL_USER }}
          subject: "ポートフォリオ公開: ${{ github.event.head_commit.message || 'manual run' }}"
          body: |
            ポートフォリオを公開しました。

            ページ: ${{ steps.deployment.outputs.page_url }}
            コミット: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

