# Portfolio: main に push されるたびに、作ったものを記事にして GitHub Pages に公開する。
#   1. scripts/build_portfolio.py … コード・NOTE.md・コミット履歴から記事ページを生成
#   2. GitHub Pages にデプロイ
name: Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 自動コミットで連続 push されたときは、古い実行を止めて最新だけ公開する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 活動履歴のために全コミットを取得
      - name: ページを生成
        run: |
          pip install markdown==3.10.3
          python3 scripts/build_portfolio.py

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
